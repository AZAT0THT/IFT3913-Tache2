name: Tests Maven

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v7

      - name: Configurer Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compiler et executer les tests
        run: ./mvnw --batch-mode --no-transfer-progress -pl tika-core -am test